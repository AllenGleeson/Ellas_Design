{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{% static 'contact/contact.css' %}">
{% endblock %}

{% block content %}
<div class="container">
        <h3 class="mb-4 mt-2">Feel free to get in touch:</h3>
        {% if message %}
            <h3>{{ message }}</h3>
        {% endif %}
        <form class="mb-3 contact-form" action="" method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn button_colors contact-submit-btn" type="submit" disabled title="Contact form disabled in showcase mode">
                Submit
            </button>
        </form>
</div>

{% endblock %}
